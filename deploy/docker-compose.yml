# AI Dad 生产部署（一台服务器）。用法见 deploy/README.md：
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# 只有 Caddy 对外开放 80/443；数据库、Redis、后端都只在内部网络里。
name: ai-dad

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://ai_dad:${POSTGRES_PASSWORD}@postgres:5432/ai_dad?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  PUBLIC_BASE_URL: https://${API_DOMAIN}
  CORS_ORIGINS: ${CORS_ORIGINS}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
  VOICE_DAILY_CHAR_LIMIT: ${VOICE_DAILY_CHAR_LIMIT:-20000}
  WX_APPID: ${WX_APPID:-}
  WX_SECRET: ${WX_SECRET:-}

services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_dad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_dad
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_dad -d ai_dad"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 每次启动先执行数据库迁移和种子数据（都可以重复执行），成功后后端才启动
  migrate:
    image: ai-dad-api:latest
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && pnpm run db:seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ai-dad-api:latest
    restart: unless-stopped
    environment: *api-env
    volumes:
      - voice_storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  voice_storage:
  caddy_data:
  caddy_config:
